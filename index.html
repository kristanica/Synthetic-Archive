<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="Homepage_imgs/SA-Logo.png">
    <title>Synthetic Archive</title>
    <style>
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .hero h1 {
            font-size: 6rem;
            margin-bottom: 1rem;
            font-weight: 900;
        }

        .hero p {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            color: var(--text-dim);
            margin-bottom: 3rem;
            font-style: italic;
        }

        .hero-btns {
            display: flex;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1 style="font-size: 0.9rem;">Synthetic Archive</h1>
            </div>
            <div class="nav-links" style="display: flex; align-items: center;">
                <button id="theme">
                    <i class='bx bxs-sun'></i>
                    <i class='bx bxs-moon'></i>
                </button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1 class="reveal">Synthetic Archive</h1>
            <p class="reveal">Exploring the intersection of art and technology.</p>
            <div class="hero-btns reveal">
                <a href="homepage.html" class="btn-minimal">Enter Archive</a>
            </div>
        </section>

        <div class="marquee-container">
            <div class="marquee-content">
                <span>CURATED COLLECTIONS // PIXEL MANIPULATION // DIGITAL FRAGMENTS // CURATED COLLECTIONS // PIXEL MANIPULATION // DIGITAL FRAGMENTS //</span>
            </div>
        </div>
    </main>

    <footer style="padding: 5rem 2rem; border-top: 1px solid var(--border); text-align: center;">
        <p style="font-size: 0.7rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase;">© 2026 Synthetic Archive // All Rights Reserved</p>
    </footer>

    <script src="theme.js"></script>
    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('appear');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
